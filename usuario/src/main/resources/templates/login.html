<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketHub - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
                <img src="https://img.icons8.com/?size=40&id=2xIX3PtQG26u&format=png&color=6f42c1" alt="Logo" class="me-2">
                TicketHub
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-sm p-4">

                    <div class="text-center mb-4">
                        <img src="https://img.icons8.com/?size=80&id=2xIX3PtQG26u&format=png&color=6f42c1" alt="Logo">
                        <h2 class="fw-bold mt-3">Entrar</h2>
                        <p class="text-muted">Faça login para continuar sua compra</p>
                    </div>

                    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Usuário</label>
                            <input type="text" name="usuario" class="form-control" placeholder="Digite seu usuário" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Senha</label>
                            <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required>
                        </div>
                        <button type="submit" class="btn btn-roxo w-100 py-2">Entrar</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/}" class="text-decoration-none">Voltar para eventos</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

</body>
</html>
