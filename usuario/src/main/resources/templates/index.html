<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketHub - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
                <img src="https://img.icons8.com/?size=40&id=2xIX3PtQG26u&format=png&color=6f42c1" alt="Logo" class="me-2">
                TicketHub
            </a>

            <!-- Busca -->
            <div class="mx-auto" style="max-width:600px; width:100%;">
                <form class="d-flex" th:action="@{/buscar}" method="get">
                    <input name="termo"
                           class="form-control me-2"
                           type="search"
                           placeholder="Buscar eventos, artistas ou locais"
                           th:value="${termo}">
                    <button class="btn btn-roxo" type="submit">Buscar</button>
                </form>
            </div>

            <!-- Botões -->
            <div class="d-flex gap-2">
                <a th:href="@{/login}" class="btn btn-outline-secondary" th:if="${session.usuarioLogado == null}">Login</a>
                <a th:href="@{/admin/eventos}" class="btn btn-roxo" th:if="${session.usuarioLogado != null and session.usuarioLogado.usuario == 'admin'}">Painel Admin</a>
                <a th:href="@{/meus-ingressos}" class="btn btn-roxo" th:if="${session.usuarioLogado != null and session.usuarioLogado.usuario != 'admin'}">Meus Ingressos</a>
                <a th:href="@{/logout}" class="btn btn-danger" th:if="${session.usuarioLogado != null}">Sair</a>
            </div>

        </div>
    </nav>

    <div class="container py-5">

        <h2 class="fw-bold">Eventos em Destaque</h2>
        <p class="text-muted">Descubra os melhores eventos próximos de você.</p>

        <div class="alert alert-info" th:if="${#lists.isEmpty(eventos)}">
            Nenhum evento encontrado.
        </div>

        <div class="row g-4">
            <div class="col-md-4" th:each="evento : ${eventos}">
                <div class="card shadow-sm h-100">
                    <img th:src="${evento.imagem}"
                         class="card-img-top"
                         style="height:220px;object-fit:cover;"
                         alt="Imagem do evento">
                    <div class="card-body">
                        <h5 th:text="${evento.titulo}"></h5>
                        <p class="text-muted">
                            <span th:text="${#temporals.format(evento.data, 'dd/MM/yyyy HH:mm')}"></span>
                            - <span th:text="${evento.local}"></span>
                        </p>
                        <p class="fw-bold" th:text="'R$ ' + ${evento.preco}"></p>
                        <a th:href="@{/pagamento/{id}(id=${evento.id})}" class="btn btn-roxo w-100">COMPRAR</a>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
