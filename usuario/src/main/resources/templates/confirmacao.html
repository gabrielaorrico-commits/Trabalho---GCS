<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>TicketHub - Compra Confirmada</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/}">
                <img src="https://img.icons8.com/?size=40&id=2xIX3PtQG26u&format=png&color=6f42c1" alt="Logo" class="me-2">
                TicketHub
            </a>
        </div>
    </nav>

    <div class="container py-5">
        <div class="card shadow-sm p-5 mx-auto text-center" style="max-width:600px;">

            <h1 class="fw-bold mb-2" style="color:#198754;">Compra Confirmada!</h1>
            <p class="text-muted mb-4">Seu ingresso foi gerado com sucesso.</p>

            <hr>

            <h4 class="fw-bold" th:text="${pedido.evento.titulo}"></h4>
            <p class="text-muted">
                <span th:text="${#temporals.format(pedido.evento.data, 'dd/MM/yyyy HH:mm')}"></span>
                &mdash;
                <span th:text="${pedido.evento.local}"></span>
            </p>

            <hr>

            <div class="text-start mx-auto" style="max-width:360px;">
                <p><strong>Nome:</strong> <span th:text="${pedido.nomeComprador}"></span></p>
                <p><strong>E-mail:</strong> <span th:text="${pedido.emailComprador}"></span></p>
                <p><strong>Quantidade:</strong> <span th:text="${pedido.quantidade}"></span></p>
                <p><strong>Total pago:</strong> R$ <span th:text="${pedido.valorTotal}"></span></p>
                <p><strong>Forma de pagamento:</strong> <span th:text="${pedido.formaPagamento}"></span></p>
            </div>

            <hr>

            <div class="d-flex gap-3 justify-content-center mt-2">
                <a th:href="@{/meus-ingressos}" class="btn btn-roxo">Ver Meus Ingressos</a>
                <a th:href="@{/}" class="btn btn-outline-secondary">Voltar para Eventos</a>
            </div>

        </div>
    </div>

</body>
</html>
